baseURL = "https://0702hjj.github.io/"
title = "111"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false

summaryLength = 0
buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 100

[imaging]
  anchor = "Center"

[taxonomies]
  tag = "tags"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

[[related.indices]]
  name = "tags"
  weight = 100

[[related.indices]]
  name = "series"
  weight = 50

[[related.indices]]
  name = "authors"
  weight = 20

[[related.indices]]
  name = "date"
  weight = 10

[[related.indices]]
  applyFilter = false
  name = "fragmentrefs"
  type = "fragments"
  weight = 10
